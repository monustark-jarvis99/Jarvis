<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS Interface</title>
    <style>
        body { background: #020813; color: #00f0ff; font-family: 'Courier New', monospace; text-align: center; padding: 40px; margin: 0; }
        .arc-reactor { width: 180px; height: 180px; border-radius: 50%; border: 4px solid #00f0ff; margin: 50px auto; box-shadow: 0 0 30px #00f0ff, inset 0 0 30px #00f0ff; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; font-weight: bold; text-shadow: 0 0 10px #00f0ff; }
        .arc-reactor.listening { animation: pulse 1s infinite alternate; border-color: #ff0055; box-shadow: 0 0 40px #ff0055, inset 0 0 40px #ff0055; color: #ff0055; text-shadow: 0 0 10px #ff0055; }
        #console-output { max-width: 600px; margin: 20px auto; padding: 20px; background: rgba(0, 240, 255, 0.05); border: 1px solid #00f0ff; border-radius: 5px; min-height: 80px; font-size: 18px; line-height: 1.5; }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.08); } }
    </style>
</head>
<body>
    <h2 style="letter-spacing: 4px;">JARVIS SYSTEM V1.0</h2>
    <div class="arc-reactor" id="jarvisBtn" onclick="activateJarvis()">TAP TO WAKE</div>
    <div id="console-output">System Online. Awaiting orders, Sir...</div>

    <script>
        // NOTE: Render par deploy karne ke baad hum yahan aapka link daalenge
        const BACKEND_URL = "https://myjarvisbrain.onrender.com/

        function activateJarvis() {
            const btn = document.getElementById('jarvisBtn');
            const output = document.getElementById('console-output');
            
            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'hi-IN';
            
            btn.classList.add('listening');
            btn.innerText = "LISTENING";
            output.innerText = "Listening to your command, Sir...";
            
            recognition.start();

            recognition.onresult = async (event) => {
                const query = event.results.transcript;
                output.innerText = `Analyzing Request: "${query}"...`;
                
                try {
                    const response = await fetch(`${BACKEND_URL}/ask_jarvis`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: query })
                    });
                    const data = await response.json();
                    
                    output.innerText = `JARVIS: ${data.reply}`;
                    
                    const speaker = new SpeechSynthesisUtterance(data.reply);
                    speaker.lang = 'hi-IN';
                    speaker.pitch = 0.9; 
                    speaker.rate = 1.0;
                    window.speechSynthesis.speak(speaker);
                    
                } catch (error) {
                    output.innerText = "Error establishing link to mainframe, Sir.";
                } finally {
                    btn.classList.remove('listening');
                    btn.innerText = "TAP TO WAKE";
                }
            };

            recognition.onerror = () => {
                btn.classList.remove('listening');
                btn.innerText = "TAP TO WAKE";
                output.innerText = "No voice detected. Standing by, Sir.";
            };
        }
    </script>
</body>
</html>
